# ==============================================================================
# TLP 1.11 Configuration for ThinkPad E16 Gen 2 (Intel Core Ultra 5 125H)
# Drop-in configuration: /etc/tlp.d/10-custom.conf -> ~/.config/tlp/10-custom.conf
# Tailored for Waybar 3-Profile Toggle (performance / balanced / power-saver)
# Reference: https://linrunner.de/tlp/settings/
# ==============================================================================
#
# Profile Matrix:
# | Metric                     | Performance (󰓅)   | Balanced (󰾅)    | Power-Saver (󰾆)  |
# | :------------------------- | :---------------- | :-------------- | :--------------- |
# | Governor                   | powersave         | powersave       | powersave        |
# | EPP Policy                 | performance       | balance_power   | power            |
# | Max Frequency              | 4.5 GHz           | 4.5 GHz         | 1.2 GHz (Base)   |
# | Turbo Boost (no_turbo)     | 0 (Allowed)       | 0 (Allowed)     | 1 (Disabled)     |
# | HWP Dynamic Boost          | 1 (On)            | 0 (Off)         | 0 (Off)          |
# | Platform Profile           | performance       | balanced        | low-power        |
# ==============================================================================

TLP_ENABLE=1

# Profile Switching & Retention
# Mode 2 retains manual selections made via tlpctl (Waybar toggle)
TLP_AUTO_SWITCH=2
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=BAL

# CPU Frequency Scaling & Driver (intel_pstate in active mode)
CPU_DRIVER_OPMODE_ON_PRF=active
CPU_DRIVER_OPMODE_ON_BAL=active
CPU_DRIVER_OPMODE_ON_SAV=active

# In active mode, 'powersave' is the dynamic scaling governor for all profiles
CPU_SCALING_GOVERNOR_ON_PRF=powersave
CPU_SCALING_GOVERNOR_ON_BAL=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave

# Energy / Performance Preference (EPP)
CPU_ENERGY_PERF_POLICY_ON_PRF=performance
CPU_ENERGY_PERF_POLICY_ON_BAL=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# Intel Turbo Boost (0 = disable, 1 = allow)
CPU_BOOST_ON_PRF=1
CPU_BOOST_ON_BAL=1
CPU_BOOST_ON_SAV=0

# Intel HWP Dynamic Boost
CPU_HWP_DYN_BOOST_ON_PRF=1
CPU_HWP_DYN_BOOST_ON_BAL=0
CPU_HWP_DYN_BOOST_ON_SAV=0

# ACPI Platform Profiles (ThinkPad firmware)
PLATFORM_PROFILE_ON_PRF=performance
PLATFORM_PROFILE_ON_BAL=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# Radio Devices & Automation (TLP-RDW)
DEVICES_TO_DISABLE_ON_STARTUP="bluetooth"
DEVICES_TO_DISABLE_ON_LAN_CONNECT="wifi wwan"

# ThinkPad Battery Care (BAT0)
START_CHARGE_THRESH_BAT0=60
STOP_CHARGE_THRESH_BAT0=75
